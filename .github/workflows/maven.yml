name: CI - Maven

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes e gerar JAR
        run: mvn -B clean verify

      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-ci-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
